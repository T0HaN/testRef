<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление заклинания | Folio</title>
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #141418;
            --bg-tertiary: #1e1e24;
            --text-primary: #e0d4b8;
            --text-secondary: #a89f8a;
            --accent-gold: #c9a961;
            --accent-gold-dim: #8b7542;
            --accent-red: #8b3a3a;
            --accent-green: #4a6b4a;
            --border-color: #3a352a;
            --shadow-color: rgba(0,0,0,0.6);
            --font-main: 'Georgia', 'Times New Roman', serif;
            --font-ui: 'Segoe UI', Tahoma, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-ui);
            background: radial-gradient(ellipse at top, #1a1610 0%, var(--bg-primary) 60%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            cursor: pointer;
            text-align: center;
            font-family: var(--font-ui);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:hover { background: var(--bg-tertiary); border-color: var(--accent-gold-dim); color: var(--accent-gold); }
        .btn-success { background: linear-gradient(145deg, var(--accent-green), #3a5a3a); color: #fff; font-weight: bold; border: none;}
        .btn-success:hover { background: linear-gradient(145deg, #5a8b5a, #4a6b4a); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74, 107, 74, 0.2); color: #fff; }

        .prep-header {
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary));
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem 1.8rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .prep-header h1 {
            font-family: var(--font-main);
            color: var(--accent-gold);
            font-size: 1.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .panel {
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary));
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-family: var(--font-main);
            color: var(--accent-gold);
            font-size: 1rem;
            letter-spacing: 0.05em;
        }

        .input-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: var(--font-ui);
            padding: 0.8rem;
            transition: border-color 0.2s;
            width: 100%;
        }
        .input-box:focus { outline: none; border-color: var(--accent-gold); }

        textarea.input-box {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
        }

        /* Стили для чекбоксов классов */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.8rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-ui);
            color: var(--text-secondary);
            font-size: 0.95rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .checkbox-label:hover {
            color: var(--text-primary);
        }
        .checkbox-label input[type="checkbox"] {
            accent-color: var(--accent-gold);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-style: italic;
            border-top: 1px solid var(--border-color);
        }

        #notification {
            display: none;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-weight: bold;
            text-align: center;
        }
        .success-msg { background: rgba(74, 107, 74, 0.2); border: 1px solid var(--accent-green); color: #fff; }
        .error-msg { background: rgba(139, 58, 58, 0.2); border: 1px solid var(--accent-red); color: #f5c6cb; }
    </style>
</head>
<body>
<div class="container">
    <header class="prep-header">
        <h1>Редактор Заклинаний</h1>
        <div class="header-actions">
            <a href="/" class="btn">Вернуться в систему</a>
        </div>
    </header>

    <div id="notification"></div>

    <div class="panel">
        <form id="spellForm">
            <div class="form-grid">
                <!-- Базовая информация -->
                <div class="form-group">
                    <label for="name_ru">Название (RU)</label>
                    <input type="text" id="name_ru" name="name_ru" class="input-box" required placeholder="Огненный шар">
                </div>
                <div class="form-group">
                    <label for="name_en">Название (EN)</label>
                    <input type="text" id="name_en" name="name_en" class="input-box" required placeholder="Fireball">
                </div>

                <div class="form-group">
                    <label for="level">Уровень</label>
                    <input type="number" id="level" name="level" class="input-box" min="0" max="9" required placeholder="3">
                </div>
                <div class="form-group">
                    <label for="school">Школа магии</label>
                    <input type="text" id="school" name="school" class="input-box" required placeholder="Воплощение">
                </div>

                <!-- Механики -->
                <div class="form-group">
                    <label for="casting_time">Время накладывания</label>
                    <input type="text" id="casting_time" name="casting_time" class="input-box" required placeholder="1 действие">
                </div>
                <div class="form-group">
                    <label for="range">Дистанция</label>
                    <input type="text" id="range" name="range" class="input-box" required placeholder="150 футов">
                </div>

                <div class="form-group">
                    <label for="components">Компоненты</label>
                    <input type="text" id="components" name="components" class="input-box" required placeholder="В, С, М">
                </div>
                <div class="form-group">
                    <label for="duration">Длительность</label>
                    <input type="text" id="duration" name="duration" class="input-box" required placeholder="Мгновенная">
                </div>

                <div class="form-group full-width">
                    <label for="source">Источник</label>
                    <input type="text" id="source" name="source" class="input-box" placeholder="Книга Игрока">
                </div>

                <!-- Классы чекбоксами -->
                <div class="form-group full-width">
                    <label>Классы</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Бард"> Бард</label>
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Жрец"> Жрец</label>
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Друид"> Друид</label>
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Паладин"> Паладин</label>
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Следопыт"> Следопыт</label>
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Чародей"> Чародей</label>
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Колдун"> Колдун</label>
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Волшебник"> Волшебник</label>
                        <label class="checkbox-label"><input type="checkbox" name="classes" value="Изобретатель"> Изобретатель</label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" class="input-box" required placeholder="Светящийся крошечный шарик вылетает из вашего пальца..."></textarea>
                </div>

                <div class="form-group full-width" style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-success" style="padding: 1rem; font-size: 1.1rem;">
                        ✦ Добавить в гримуар ✦
                    </button>
                </div>
            </div>
        </form>
    </div>

    <footer class="footer">
        <p>«Магия требует точности. Одна неверная руна, и от вас останется лишь пепел.»</p>
    </footer>
</div>

<script>
    document.getElementById('spellForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.target;
        const notification = document.getElementById('notification');

        // Собираем выбранные классы из чекбоксов
        const checkedClasses = Array.from(form.querySelectorAll('input[name="classes"]:checked')).map(cb => cb.value);

        const payload = {
            name_ru: form.name_ru.value,
            name_en: form.name_en.value,
            level: parseInt(form.level.value),
            school: form.school.value,
            casting_time: form.casting_time.value,
            range: form.range.value,
            components: form.components.value,
            duration: form.duration.value,
            description: form.description.value,
            source: form.source.value,
            classes: checkedClasses
        };

        try {
            const response = await fetch('/api/spells', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                notification.className = 'success-msg';
                notification.textContent = 'Заклинание успешно добавлено!';
                notification.style.display = 'block';
                form.reset();
            } else {
                throw new Error('Ошибка сервера');
            }
        } catch (error) {
            notification.className = 'error-msg';
            notification.textContent = 'Не удалось сохранить заклинание. Проверьте соединение с сервером.';
            notification.style.display = 'block';
        }

        setTimeout(() => {
            notification.style.display = 'none';
        }, 5000);
    });
</script>
</body>
</html>
