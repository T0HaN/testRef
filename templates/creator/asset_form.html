<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ 'Правка ассета' if is_edit else 'Новый ассет' }} • Folio</title>
    <link rel="icon" href="/static/images/Logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/login.css?v=2">
    <link rel="stylesheet" href="/static/css/creator.css?v=1">
</head>
<body>
    <div class="login-container form-container">
        <header class="header">
            <h1 class="realm-title">{{ 'Правка ассета' if is_edit else 'Сотворение ассета' }}</h1>
            <p class="subtitle">Параметры и наполнение летописи</p>
        </header>

        <form method="post" enctype="multipart/form-data" id="asset-form">
            <input type="hidden" name="metadata_json" id="metadata_json" value="{{ asset.metadata | tojson if is_edit else '{}' }}">

            <!-- БАЗОВЫЕ ПОЛЯ -->
            <div class="form-group">
                <label for="title">Название ассета</label>
                <input type="text" id="title" name="title" required value="{{ asset.title if is_edit else '' }}" placeholder="Например: Пещера Забытого Лича">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="asset_type">Тип ассета</label>
                    <select id="asset_type" name="asset_type" {% if is_edit %}disabled{% endif %}>
                        <option value="map" {% if is_edit and asset.asset_type == 'map' %}selected{% endif %}>🗺️ Карта (Battlemap)</option>
                        <option value="monster" {% if is_edit and asset.asset_type == 'monster' %}selected{% endif %}>🐉 Бестиарий (Монстр)</option>
                        <option value="spell" {% if is_edit and asset.asset_type == 'spell' %}selected{% endif %}>✨ Заклинание</option>
                        <option value="class" {% if is_edit and asset.asset_type == 'class' %}selected{% endif %}>🛡️ Класс / Архетип</option>
                        <option value="music" {% if is_edit and asset.asset_type == 'music' %}selected{% endif %}>🎵 Саундтрек / Эмбиент</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="price">Цена (₽)</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" value="{{ asset.price if is_edit else '0.00' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="license_type">Лицензия</label>
                    <select id="license_type" name="license_type">
                        <option value="personal" {% if is_edit and asset.license_type == 'personal' %}selected{% endif %}>Личное использование (Personal)</option>
                        <option value="commercial" {% if is_edit and asset.license_type == 'commercial' %}selected{% endif %}>Коммерческая (Commercial)</option>
                    </select>
                </div>

                <div class="form-group flex-center-checkbox">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="is_published" value="true" {% if is_edit and asset.is_published %}checked{% endif %}>
                        <span>Опубликовать в каталоге</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Описание летописи</label>
                <textarea id="description" name="description" rows="3">{{ asset.description if is_edit else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="cover_image">Обложка ассета (Превью в каталоге)</label>
                <input type="file" id="cover_image" name="cover_image" accept="image/*">
            </div>

            <div class="ornament">❖ ❖ ❖</div>

            <!-- ДИНАМИЧЕСКАЯ СЕКЦИЯ МЕТАДАННЫХ -->
            <div id="dynamic-metadata-container">
                <!-- Заполняется JavaScript в зависимости от выбранного asset_type -->
            </div>

            <div class="btn-row">
                <button type="submit" id="save-btn">Сохранить ассет</button>
            </div>
        </form>

        <div class="toggle-mode">
            <a href="/creator/assets">← Назад к списку</a>
        </div>
    </div>

    <script src="/static/js/creator.js"></script>
</body>
</html>
