<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новый ключ • Folio</title>
    <link rel="icon" href="/static/images/Logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/login.css?v=2">
    <link rel="stylesheet" href="/static/css/reset_password.css?v=1">
</head>
<body>
    <div class="login-container">
        <header class="header">
            <h1 class="realm-title">
                <img src="/static/images/Folio.png" alt="Folio" />
            </h1>
            <p class="subtitle">Сотворение нового ключа</p>
        </header>

        <div class="messages">
            {% if error %}
                <div class="msg error">⚔️ {{ error }}</div>
            {% endif %}
            {% if info %}
                <div class="msg info">📜 {{ info }}</div>
            {% endif %}
        </div>

        <form method="post" action="/reset-password" novalidate id="reset-form">
            <!-- Одноразовый токен из URL, полученный из письма -->
            <input type="hidden" name="token" value="{{ token }}">

            <div class="form-group">
                <label for="new_password">Новый тайный ключ (пароль)</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    required
                    minlength="4"
                    placeholder="Минимум 4 символа..."
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Повторите тайный ключ</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    minlength="4"
                    placeholder="Повторите ввод ключа..."
                    autocomplete="new-password"
                >
            </div>

            <div class="ornament">❖ ❖ ❖</div>

            <div class="btn-row">
                <button type="submit" id="submit-btn">Запечатать новый пароль</button>
            </div>
        </form>

        <div class="toggle-mode">
            <a href="/login" class="back-link">← Отменить и вернуться ко входу</a>
        </div>

        <footer class="footer">
            <p>«Крепок тот замок, чей ключ ведом лишь создателю.»</p>
        </footer>
    </div>

    <script src="/static/js/reset_password.js"></script>
</body>
</html>
